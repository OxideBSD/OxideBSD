[package]
name = "cron"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[[bin]]
name = "cron"
path = "src/main.rs"

[dependencies]
libc = "0.2"
# The table format and the schedule (lib/libcron), shared with crontab(1).
libcron = { path = "../../lib/libcron" }
logincap = { path = "../../lib/liblogincap" }
pam = { path = "../../lib/libpam" }
pwd = { path = "../../lib/libpwd" }

# The libc fork OxideBSD's std is built with (target_os = "oxidebsd"); a [patch] only applies
# from the workspace root, so each binary repeats lib/libsh's.
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, built by build.rs's
# build_std_oxidebsd_userland_crate, and testable on the host (.cargo/config.toml).
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("oxidebsd"))'] }
