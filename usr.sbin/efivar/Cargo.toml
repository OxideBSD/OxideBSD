[package]
name = "efivar"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
libc = "0.2"
libefivar = { path = "../../lib/libefivar", features = ["dev"] }

# The libc fork OxideBSD's std is built with; a [patch] only applies from the workspace root.
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, built by build.rs's
# build_std_oxidebsd_userland_crate, installed as /usr/sbin/efivar. `cargo test` here runs on the
# host (.cargo/config.toml).
[workspace]
