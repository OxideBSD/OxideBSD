[package]
name = "vipw"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
libc = "0.2"
grp = { path = "../../lib/libgrp" }
pwd = { path = "../../lib/libpwd" }

# The libc fork OxideBSD's std is built with; a [patch] only applies from the workspace root.
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, installed as
# /usr/sbin/vipw.
[workspace]
