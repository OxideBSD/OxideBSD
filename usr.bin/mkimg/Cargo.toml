[package]
name = "mkimg"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
# Its tables are written by libpart (INSTALLER.md §8.1), as gpart(8) and the installer write theirs.
libpart = { path = "../../lib/libpart" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, built by build.rs's
# build_std_oxidebsd_userland_crate and installed as /usr/bin/mkimg; also built for the host,
# where build.rs makes the system's disk images with it (RAM_FLOOR.md §4.4).
[workspace]
