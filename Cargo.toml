[package]
name = "oxidebsd"
version = "0.3.0-dev"
edition = "2024"
license = "BSD-3-Clause"

# Real BSD source trees name the kernel `sys/`, not `src/` -- Cargo's own default convention
# (`src/lib.rs`/`src/main.rs`, applied automatically whenever no explicit `[lib]`/`[[bin]]` path is
# given) stops applying the moment the directory isn't literally named `src`, so both need spelling
# out explicitly here.
[lib]
path = "sys/lib.rs"

[[bin]]
name = "oxidebsd"
path = "sys/main.rs"

# Gates the Multiboot2 boot path (`sys/boot/multiboot2.rs`) out of the main kernel binary and all
# existing `tests/*.rs` at the source level -- only `regress/multiboot2-boot-smoke` (trampoline-only
# smoke test) and `regress/multiboot2-kernel` (the real kernel, reachable via GRUB/Multiboot2) enable
# it. See CLAUDE.md's Multiboot2 section.
[features]
multiboot2 = []

[dependencies]
limine = "0.6"
linked_list_allocator = { version = "0.10", default-features = false }
pc-keyboard = "0.9"
spin = "0.9"
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }

[[test]]
name = "basic_boot"
harness = false

