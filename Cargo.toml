# QEMU run/test args (accel/serial/RAM size/NIC/the real ATA data-disk attachment) used to live
# here as `[package.metadata.bootimage]` -- moved to `scripts/qemu_runner.sh` (this project's own
# replacement for the retired `bootimage` tool/Limine migration) verbatim, including that script's
# own copy of the historical reasoning comments for each flag. See that file for the current
# `-m`/`-accel`/`-nic`/disk-attachment/exit-code/timeout logic.

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
