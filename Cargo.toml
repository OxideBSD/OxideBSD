[package]
name = "oxidebsd"
version = "0.3.0-dev"
edition = "2024"
license = "BSD-3-Clause"

[dependencies]
limine = "0.6"
linked_list_allocator = { version = "0.10", default-features = false }
pc-keyboard = "0.9"
spin = "0.9"
x86_64 = { version = "0.15", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
chacha20 = { version = "0.10", default-features = false, features = ["cipher"] }

