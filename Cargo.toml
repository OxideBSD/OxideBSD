# -m 1024 (was QEMU's own unstated default, ~128 MiB): modules/oxfs's own in-memory block pool
# grew to 32 MiB once the BusyBox roster grew to ~300 applets (see CLAUDE.md's BusyBox section),
# and -- since src/memory.rs's frame allocator never reclaims and this kernel maps every module
# page eagerly, not on demand -- that pool is a real physical-memory commitment from the moment
# modules/oxfs loads, on top of the kernel image/heap/stacks and the module's own embedded ELF
# bytes (~18 MiB) also resident at the same time. 1024 MiB leaves generous headroom over that, and
# scales src/allocator.rs's own RAM-proportional heap size up to its 128 MiB ceiling too -- safe to
# do now that src/allocator.rs's init_heap and src/module.rs's map_region both map freshly
# allocated pages with `.ignore()` instead of `.flush()` (a real, measured multi-minute boot stall
# otherwise: this RAM bump alone, before that fix, pushed the heap to ~32,000 pages, each
# individually `invlpg`-flushed and trapped under QEMU's software TCG emulation).
[package.metadata.bootimage]
# -accel kvm -accel tcg: neither test-args nor run-args ever requested an accelerator before, so
# QEMU silently ran pure-software TCG the whole time -- normally fine (this kernel boots in a
# couple seconds under it), but TCG's per-instruction interpretation overhead is entirely at the
# mercy of host CPU contention, and under load this boot went from ~4s to well past a minute,
# indistinguishable from a genuine hang (confirmed: the exact same stall reproduces on a clean
# pre-networking master checkout with plain `cargo run`, so it was never caused by any of this
# branch's own code -- see this repo's networking plan/session history for the investigation).
# Two repeated `-accel` flags, not the single-flag `kvm:tcg` list form -- this QEMU build rejects
# that syntax outright (`invalid accelerator kvm:tcg`); passing `-accel` twice is the form that
# actually falls back to tcg when `/dev/kvm` isn't available (nested VMs, CI, sandboxes).
# -nic user,model=rtl8139: an rtl8139 NIC on QEMU's built-in SLIRP user-mode network backend, no
# host tap/bridge setup required. `bootimage` shares one test-args list across every `[[test]]`
# target, so this also boots basic_boot/fork_wait with the device present -- harmless, since
# neither calls oxidebsd::net::rtl8139::init. See tests/rtl8139_smoke.rs and this repo's
# networking plan.
#
# -drive if=none,id=oxfsdisk,... -device ide-hd,drive=oxfsdisk,bus=ide.1,unit=0: real disk
# persistence (see src/ata.rs and modules/oxfs's own "Real disk persistence" section). `bootimage`
# always attaches this kernel's own boot image as `-drive format=raw,file=<image>` with no explicit
# `if=`, which QEMU resolves to the *primary* IDE master (`ide.0`, unit 0) on this project's
# implicit `i440fx` machine type -- so this pins the data disk explicitly to the *secondary*
# channel's master (`ide.1`, unit 0) by bus name, rather than a second bare `-drive` and hoping
# QEMU's own index-assignment heuristics land somewhere that doesn't collide. `target/
# oxfs_test_disk.img` (build.rs, always freshly zeroed) here vs. `target/oxfs_disk.img` (build.rs,
# created once and left alone) in run-args below -- same "shared across every test target,
# harmless for the ones that don't use it" reasoning as `-nic` above, but tests get their own
# disposable disk rather than sharing `cargo run`'s real persistent one.
test-args = [
  "-accel", "kvm",
  "-accel", "tcg",
  "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04",
  "-serial", "stdio",
  "-display", "none",
  "-m", "1024",
  "-nic", "user,model=rtl8139",
  "-drive", "if=none,id=oxfsdisk,format=raw,file=target/oxfs_test_disk.img",
  "-device", "ide-hd,drive=oxfsdisk,bus=ide.1,unit=0",
]
test-success-exit-code = 33
test-timeout = 300
run-args = [
  "-accel", "kvm",
  "-accel", "tcg",
  "-serial", "stdio",
  "-m", "1024",
  "-nic", "user,model=rtl8139",
  "-drive", "if=none,id=oxfsdisk,format=raw,file=target/oxfs_disk.img",
  "-device", "ide-hd,drive=oxfsdisk,bus=ide.1,unit=0",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
