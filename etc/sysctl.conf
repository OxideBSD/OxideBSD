# Kernel variables set at boot by /etc/rc.d/sysctl: one name=value per line, as sysctl(8) takes
# them on its command line. Local settings may also go in /etc/sysctl.conf.local, applied after
# this file. See sysctl.conf(5).
#
# Variables fixed at boot (tunables, such as kern.msgbufsize) can't be set here: they belong on
# the kernel command line.
#
#kern.hostname=oxidebsd
