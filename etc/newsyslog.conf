#
# /etc/newsyslog.conf: which logs newsyslog(8) rotates, and when; see newsyslog.conf(5).
#
# size is in KiB; when is a number of hours, @ and an ISO 8601 time (@T00 is every midnight),
# or $ and a day (D), week (W) or month (M) spec. Flags: C create with -C, J bzip2, Z gzip,
# B no rotation message, N signal nothing. syslogd is sent SIGHUP unless a pid file is given.
# Files in /etc/newsyslog.conf.d and /usr/local/etc/newsyslog.conf.d ending in ".conf" are
# read too.
#
# logfilename		[owner:group]	mode count size	when	flags [/pid_file] [sig_num]
#/var/log/all.log			600  7	   *	@T00	JC
/var/log/auth.log			600  7	   1000	@0101T	JC
/var/log/cron				600  3	   1000	*	JC
/var/log/maillog			640  7	   *	@T00	JC
/var/log/messages			644  5	   1000	@0101T	JC
/var/log/security			600  10	   1000	*	JC
include					/etc/newsyslog.conf.d
include					/usr/local/etc/newsyslog.conf.d
