#
# /etc/syslog.conf: where system log messages go; see syslog.conf(5).
#
# Each line is a selector (facility.level, several joined by ";") and an action (a file, which
# must exist, "|command", "@host", user names, or "*" for everyone logged in), separated by white
# space. Files in /etc/syslog.d and /usr/local/etc/syslog.d ending in ".conf" are read too.
#
*.err;kern.warning;auth.notice;mail.crit		/dev/console
*.notice;authpriv.none;kern.debug;lpr.info;mail.crit;news.err	/var/log/messages
security.*					/var/log/security
auth.info;authpriv.info				/var/log/auth.log
mail.info					/var/log/maillog
cron.*						/var/log/cron
*.emerg						*
include						/etc/syslog.d
include						/usr/local/etc/syslog.d
