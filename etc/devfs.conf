#
# /etc/devfs.conf: owners, modes and links for /dev, applied at boot by rc.d/devfs; see
# devfs.conf(5). /dev is made afresh at every boot, so a chmod or chown there by hand lasts only
# until reboot; put it here to keep it.
#
# action	device (a pattern, under /dev)	argument
#
#own		ttyv0				root:tty
#perm		ttyv0				0620
#link		ttyv0				vt0
