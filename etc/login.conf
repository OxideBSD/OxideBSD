#
# /etc/login.conf: login classes; see login.conf(5).
#
# The class is the fifth field of /etc/master.passwd. An empty class means `default', and root's
# is `root'. Records use the getcap(3) format.
#
default:\
	:welcome=/etc/motd:\
	:setenv=MAIL=/var/mail/$,BLOCKSIZE=K:\
	:path=/sbin /bin /usr/sbin /usr/bin /usr/local/sbin /usr/local/bin /usr/games ~/bin:\
	:nologin=/var/run/nologin:\
	:cputime=unlimited:\
	:datasize=unlimited:\
	:stacksize=unlimited:\
	:memorylocked=64K:\
	:memoryuse=unlimited:\
	:filesize=unlimited:\
	:coredumpsize=unlimited:\
	:openfiles=unlimited:\
	:maxproc=unlimited:\
	:priority=0:\
	:umask=022:\
	:login-timeout=300:\
	:login-retries=10:\
	:login-backoff=3:

#
# Root's class: the default, with no limit on locked memory.
#
root:\
	:ignorenologin:\
	:memorylocked=unlimited:\
	:tc=default:

#
# The daemon class, for services started by rc(8).
#
daemon:\
	:memorylocked=128M:\
	:tc=default:
