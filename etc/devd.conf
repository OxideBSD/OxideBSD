#
# /etc/devd.conf: what devd(8) does when a device comes or goes; see devd.conf(5). This is a
# shell script: `on VERB CLASS HANDLER [NAME=PATTERN | NAME!=PATTERN ...]` adds a rule, and a
# matching event runs HANDLER (a function, or a command line in quotes) with the event's fields
# as variables. Keep local rules in /etc/devd/*.conf, which is read after this file.
#

on attach disk 'logger -t devd "disk $name attached: $model ($bus, $kind)"'
on detach disk 'logger -t devd "disk $name detached"'
on lost root 'logger -p daemon.crit -t devd "the root disk ($name) is gone"'

# A disc found in a CD drive, at boot or later, is mounted read-only on the lowest-numbered
# /cdrom/disk<N> nothing is mounted on. The drive's tray stays locked until it's unmounted.
cd_mount()
{
	grep -q "^/dev/$name " /proc/mounts && return 0
	_n=0
	while grep -q " /cdrom/disk$_n " /proc/mounts; do
		_n=$((_n + 1))
	done
	mkdir -p "/cdrom/disk$_n" &&
	mount -t cd9660 -o ro "/dev/$name" "/cdrom/disk$_n" &&
	logger -t devd "disc in $name mounted on /cdrom/disk$_n"
}
on media cd cd_mount state=inserted

# Examples:
#
# Every event, to the log:
#	on '*' '*' 'logger -t devd "$verb $class $name"'
