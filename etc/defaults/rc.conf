#
# /etc/defaults/rc.conf: default settings for rc(8) and the rc.d scripts; see rc.conf(5).
#
# Do not edit this file. Override its settings in /etc/rc.conf, which is read after it.
# Both files may contain only assignments and comments (INIT_SH.md §4.6).
#

rc_conf_files="/etc/rc.conf /etc/rc.conf.local"	# Read after this file, in order
rc_info="NO"			# Print informational messages from rc.d scripts
rc_debug="NO"			# Print debugging messages from rc.d scripts
rc_startmsgs="YES"		# Print "Starting foo." at boot
rcshutdown_timeout="90"		# Seconds rc.shutdown may run before init stops it

### Basic startup ###
hostname=""			# This host's name; empty keeps the kernel's default
tmpmfs="AUTO"			# Mount a tmpfs on /tmp: YES, NO, or AUTO (only if /tmp
				# isn't writable)
tmpmfs_flags=""			# Extra mount(8) options for that tmpfs
cleanvar_enable="YES"		# Remove stale files from /var/run at boot

### System logging (syslogd(8), newsyslog(8)) ###
syslogd_enable="YES"		# Run the system log daemon
syslogd_flags="-s"		# Flags to syslogd; -s: don't receive from the network
newsyslog_enable="YES"		# Create missing log files at boot
newsyslog_flags="-CN"		# Flags to newsyslog at boot

### Scheduled commands (cron(8)) ###
cron_enable="YES"		# Run the periodic job daemon
cron_flags=""			# Flags to cron
