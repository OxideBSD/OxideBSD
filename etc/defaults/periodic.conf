#
# /etc/defaults/periodic.conf: default settings for periodic(8) and its scripts; see
# periodic.conf(5).
#
# Do not edit this file. Override its settings in /etc/periodic.conf, which is read after it.
#

periodic_conf_files="/etc/periodic.conf /etc/periodic.conf.local"	# Read after this file

### Daily ###
daily_output="/var/log/daily.log"	# A file to append to, or a user to log for
daily_show_success="YES"		# Keep the output of scripts that found nothing notable
daily_show_info="YES"			# Keep the output of scripts that found something
daily_show_badconfig="NO"		# Keep the output of scripts that were misconfigured

# 110.clean-tmps
daily_clean_tmps_enable="NO"		# Remove old files from the directories below
daily_clean_tmps_dirs="/tmp"		# Directories to clean
daily_clean_tmps_days="3"		# Remove files untouched for this many days
daily_clean_tmps_ignore=".X*-lock .X11-unix .ICE-unix .font-unix .XIM-unix"	# Never remove these

# 200.backup-passwd
daily_backup_passwd_enable="YES"	# Report and back up changes to the account files

# 400.status-disks
daily_status_disks_enable="YES"		# Show disk usage
daily_status_disks_df_flags="-h"	# Flags to df

# 430.status-uptime
daily_status_uptime_enable="YES"	# Show the uptime and load

# 999.local
daily_local="/etc/daily.local"		# Local commands, run last

### Weekly ###
weekly_output="/var/log/weekly.log"
weekly_show_success="YES"
weekly_show_info="YES"
weekly_show_badconfig="NO"

# 999.local
weekly_local="/etc/weekly.local"

### Monthly ###
monthly_output="/var/log/monthly.log"
monthly_show_success="YES"
monthly_show_info="YES"
monthly_show_badconfig="NO"

# 999.local
monthly_local="/etc/monthly.local"

# Reads the files of $periodic_conf_files that exist, once per script. Every periodic script
# starts by reading this file and calling it.
if [ -z "${_source_periodic_confs_defined}" ]; then
	_source_periodic_confs_defined=yes
	source_periodic_confs()
	{
		local _i
		for _i in ${periodic_conf_files}; do
			if [ -r "${_i}" ]; then
				. "${_i}"
			fi
		done
	}
fi
