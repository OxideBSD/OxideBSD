# OpenSSL Configure target for OxideBSD, loaded with `Configure --config=` so the vendored tree
# (external/apache2/openssl) stays unpatched. build.rs's `build_openssl` drives it.
#
# The compiler is musl-gcc, i.e. the host gcc, which defines __linux__: OpenSSL's sources take
# their Linux paths (getrandom through syscall(SYS_getrandom), which our musl maps). The Linux-only
# features that would need kernel support we don't have are switched off on the Configure command
# line (no-afalgeng, no-ktls), not here, so a disabled feature is visible where it's decided.
#
# Dynamically linked, as on the BSDs: libcrypto.so.3 and libssl.so.3, the legacy provider as a
# loadable module (ossl-modules/legacy.so, through dlopen), and the openssl program a PIE. The
# static archives are installed too, for static consumers; their objects are PIC, so they link
# into static PIE programs.
#
# asm stays on. The kernel saves only FXSAVE state (no XSAVE, CR4.OSXSAVE clear), and
# crypto/x86_64cpuid.pl clears the AVX/AVX-512 capability bits when OSXSAVE is clear, so the
# SSE-encoded paths (AES-NI, PCLMULQDQ, SHA-NI) are the fastest ones used.

my %targets = (
    "oxidebsd-x86_64" => {
        inherit_from     => [ "BASE_unix" ],
        CC               => "cc",
        CFLAGS           => picker(default => "-Wall",
                                   debug   => "-O0 -g",
                                   release => "-O2"),
        cflags           => add("-m64", threads("-pthread")),
        lib_cflags       => add("-fPIC"),
        lib_cppflags     => add("-DL_ENDIAN"),
        bin_cflags       => add("-fPIE"),
        bin_lflags       => add("-pie"),
        ex_libs          => add(threads("-pthread")),
        bn_ops           => "SIXTY_FOUR_BIT_LONG",
        thread_scheme    => "pthreads",
        dso_scheme       => "dlfcn",
        shared_target    => "bsd-gcc-shared",
        shared_cflag     => "-fPIC",
        shared_extension => ".so.\$(SHLIB_VERSION_NUMBER)",
        asm_arch         => "x86_64",
        perlasm_scheme   => "elf",
    },
);
