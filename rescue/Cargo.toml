[package]
name = "rescue"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

# Every library the crunched tools use (src/main.rs): the union of their own Cargo.tomls.
[dependencies]
libc = "0.2"
flate = { path = "../lib/libz" }
fstab = { path = "../lib/libfstab" }
libsh = { path = "../lib/libsh", features = ["init-dialect"] }
mode = { path = "../lib/libmode" }
msdosfs_format = { path = "../lib/libmsdosfs" }
oxfs_format = { path = "../lib/liboxfs" }
regex_posix = { path = "../lib/libregex" }
ttyent = { path = "../lib/libttyent" }

# The libc fork OxideBSD's std is built with (target_os = "oxidebsd"); a [patch] only applies
# from the workspace root, so each binary repeats lib/libsh's.
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, built by build.rs's
# build_std_oxidebsd_userland_crate. `cargo test` here runs on the host (.cargo/config.toml).
[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("oxidebsd"))'] }
