[package]
name = "grep"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[dependencies]
libc = "0.2"
posixre = { package = "regex_posix", path = "../../lib/libregex" }

# The libc fork OxideBSD's std is built with (target_os = "oxidebsd"); a [patch] only applies
# from the workspace root, so each binary repeats lib/libsh's.
[patch.crates-io]
libc = { git = "https://github.com/OxideBSD/libc-crate-oxidebsd.git", branch = "oxidebsd" }

# Opts out of the root workspace: a std program for x86_64-unknown-oxidebsd, built by build.rs's
# build_static_std_crate, installed as /bin/grep.
[workspace]
