[package]
name = "std-hello"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately empty -- opts this crate OUT of the root repo's `[workspace]` (which cargo would
# otherwise auto-detect by directory-tree walk-up alone, regardless of this being a fundamentally
# different build: real prebuilt `std` for `x86_64-unknown-linux-musl`, not the kernel's own
# `-Z build-std` no_std target). Confirmed live: without this, `cargo build` refuses to run at
# all ("current package believes it's in a workspace when it's not").
[workspace]
